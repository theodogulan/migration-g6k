<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6EFDF"/><stop offset="1" stop-color="#EADFC6"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9B88F"/><stop offset="1" stop-color="#B4A27A"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A6B"/><stop offset="1" stop-color="#0F2342"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24BDB2"/><stop offset="1" stop-color="#0E8A83"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4BC5A"/><stop offset="1" stop-color="#D98E22"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#CFEFEC" stop-opacity=".35"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .1  0 0 0 .09 0"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#12284B" opacity=".12"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#fff" stroke-opacity=".35" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <!-- large window light -->
  <g opacity=".55"><rect x="560" y="60" width="480" height="330" rx="10" fill="#FFF8E6"/><path d="M800 60V390M560 225H1040" stroke="#EADFC6" stroke-width="10"/></g>
  <path d="M600 400L430 900H1180L1000 400Z" fill="#FFF3D1" opacity=".35"/>
  <!-- floor -->
  <rect y="640" width="1600" height="260" fill="url(#floor)"/>
  <path d="M0 640H1600" stroke="#8F7E58" stroke-width="3" opacity=".6"/>
  <g stroke="#9C8A62" stroke-opacity=".5"><path d="M0 720H1600M0 800H1600M0 880H1600"/></g>

  <!-- LEFT : étagère des services existants -->
  <g>
    <rect x="40" y="130" width="420" height="520" rx="8" fill="#6C7C95" opacity=".18"/>
    <rect x="50" y="120" width="12" height="530" fill="#8A6A3E"/><rect x="438" y="120" width="12" height="530" fill="#8A6A3E"/>
    <g fill="#A47C48"><rect x="50" y="270" width="400" height="14"/><rect x="50" y="450" width="400" height="14"/><rect x="50" y="636" width="400" height="14"/></g>
    <!-- shelf 1 : CERFA forms -->
    <g transform="translate(78 150)">
      <rect width="96" height="120" rx="4" fill="#FFFFFF" stroke="#C9BFA6"/><rect x="10" y="12" width="48" height="8" fill="#12284B"/><g fill="#D8D2C2"><rect x="10" y="30" width="76" height="6"/><rect x="10" y="44" width="76" height="6"/><rect x="10" y="58" width="60" height="6"/></g><rect x="10" y="76" width="34" height="26" fill="none" stroke="#12284B"/><rect x="52" y="76" width="34" height="26" fill="none" stroke="#12284B"/>
    </g>
    <g transform="translate(190 160) rotate(-4 40 55)"><rect width="88" height="110" rx="4" fill="#FFF6DD" stroke="#D9C791"/><g fill="#E0CF9C"><rect x="10" y="14" width="68" height="6"/><rect x="10" y="28" width="68" height="6"/><rect x="10" y="42" width="50" height="6"/><rect x="10" y="56" width="68" height="6"/></g><path d="M62 90l8-12 8 12z" fill="#D98E22"/></g>
    <g transform="translate(300 172)"><rect width="110" height="98" rx="8" fill="#D9E6F3" stroke="#9FB4CC"/><rect x="12" y="12" width="86" height="22" rx="3" fill="#fff"/><g fill="#12284B"><circle cx="24" cy="58" r="6"/><circle cx="46" cy="58" r="6" opacity=".5"/><circle cx="68" cy="58" r="6" opacity=".5"/></g><rect x="12" y="74" width="50" height="12" rx="3" fill="#0E8A83"/></g>
    <!-- shelf 2 : crates -->
    <g transform="translate(78 330)"><rect width="150" height="120" rx="4" fill="#C79A5B"/><rect x="8" y="8" width="134" height="104" fill="#D8AE72"/><g stroke="#A47C48" stroke-width="4"><path d="M8 40H142M8 76H142"/></g><rect x="32" y="22" width="86" height="64" rx="3" fill="#fff" stroke="#8A6A3E"/><rect x="42" y="32" width="40" height="7" fill="#12284B"/><g fill="#D8D2C2"><rect x="42" y="46" width="66" height="5"/><rect x="42" y="58" width="52" height="5"/></g></g>
    <g transform="translate(248 346)"><rect width="190" height="104" rx="4" fill="#C79A5B"/><rect x="8" y="8" width="174" height="88" fill="#D8AE72"/><g transform="translate(18 14)"><rect width="70" height="68" rx="3" fill="#fff" stroke="#8A6A3E"/><path d="M10 52l14-16 12 10 18-24" stroke="#D98E22" stroke-width="4" fill="none"/></g><g transform="translate(100 14)"><rect width="70" height="68" rx="3" fill="#EAF7F5" stroke="#8A6A3E"/><g fill="#0E8A83"><rect x="10" y="12" width="50" height="8"/><rect x="10" y="28" width="38" height="8"/><rect x="10" y="44" width="46" height="8"/></g></g></g>
    <!-- shelf 3 : stack of letters -->
    <g transform="translate(76 520)"><rect width="150" height="116" rx="2" fill="#fff" stroke="#C9BFA6"/><rect x="6" y="-8" width="150" height="116" rx="2" fill="#FFF8E6" stroke="#D9C791"/><rect x="12" y="-16" width="150" height="116" rx="2" fill="#fff" stroke="#C9BFA6"/><g fill="#D8D2C2"><rect x="30" y="2" width="100" height="6"/><rect x="30" y="16" width="100" height="6"/><rect x="30" y="30" width="70" height="6"/></g></g>
    <g transform="translate(262 540)"><rect width="170" height="96" rx="6" fill="#12284B"/><rect x="12" y="12" width="146" height="14" rx="2" fill="#24BDB2" opacity=".8"/><g fill="#fff" opacity=".7"><rect x="12" y="38" width="100" height="6"/><rect x="12" y="52" width="120" height="6"/><rect x="12" y="66" width="80" height="6"/></g></g>
  </g>

  <!-- CENTER : l'établi d'analyse et de vérification -->
  <g>
    <ellipse cx="800" cy="738" rx="330" ry="26" fill="#5B4A2B" opacity=".35" filter="url(#soft)"/>
    <rect x="500" y="560" width="600" height="38" rx="6" fill="#8A6A3E"/>
    <rect x="500" y="560" width="600" height="12" rx="6" fill="#B58B52"/>
    <rect x="530" y="598" width="26" height="150" fill="#6B5230"/><rect x="1044" y="598" width="26" height="150" fill="#6B5230"/>
    <!-- document under the lens -->
    <g transform="translate(610 392) rotate(-3)"><rect width="230" height="172" rx="4" fill="#fff" stroke="#C9BFA6"/>
      <rect x="18" y="16" width="90" height="10" fill="#12284B"/>
      <g fill="#D8D2C2"><rect x="18" y="40" width="190" height="6"/><rect x="18" y="54" width="170" height="6"/><rect x="18" y="68" width="190" height="6"/></g>
      <rect x="18" y="92" width="86" height="54" fill="none" stroke="#12284B" stroke-width="2"/>
      <g stroke="#0E8A83" stroke-width="4" fill="none" stroke-linecap="round"><path d="M122 104l8 9 16-18"/><path d="M122 130l8 9 16-18"/></g>
      <g fill="#D8D2C2"><rect x="156" y="104" width="50" height="6"/><rect x="156" y="130" width="50" height="6"/></g></g>
    <!-- magnifier -->
    <g transform="translate(715 410)"><circle r="82" fill="url(#glass)" stroke="#12284B" stroke-width="12"/><circle r="70" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3"/><path d="M-40 -42a60 60 0 0 1 34 -14" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".9"/><path d="M58 58L128 128" stroke="#12284B" stroke-width="22" stroke-linecap="round"/><path d="M58 58L128 128" stroke="#D98E22" stroke-width="8" stroke-linecap="round"/>
      <g stroke="#0E8A83" stroke-width="3" fill="none"><path d="M-40 -6h50M-40 14h72M-40 34h40"/></g><circle cx="-40" cy="-6" r="4" fill="#D98E22"/><circle cx="32" cy="14" r="4" fill="#D98E22"/></g>
    <!-- clipboard checklist -->
    <g transform="translate(930 410) rotate(5)"><rect width="140" height="170" rx="10" fill="#12284B"/><rect x="10" y="18" width="120" height="142" rx="4" fill="#FFFDF6"/><rect x="42" y="4" width="56" height="22" rx="6" fill="#D98E22"/>
      <g stroke="#0E8A83" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M24 58l8 9 15-18"/><path d="M24 92l8 9 15-18"/></g><circle cx="35" cy="128" r="9" fill="none" stroke="#D98E22" stroke-width="4"/>
      <g fill="#D8D2C2"><rect x="60" y="56" width="58" height="7"/><rect x="60" y="90" width="58" height="7"/><rect x="60" y="126" width="58" height="7"/></g></g>
    <!-- balance scale / comparer -->
    <g transform="translate(800 250)"><path d="M0 0V86" stroke="#12284B" stroke-width="8" stroke-linecap="round"/><path d="M-90 20H90" stroke="#12284B" stroke-width="8" stroke-linecap="round"/><circle cy="0" r="12" fill="#D98E22"/>
      <path d="M-90 20l-34 64h68z M90 20l-34 64h68z" fill="none" stroke="#12284B" stroke-width="3"/>
      <path d="M-134 84a44 22 0 0 0 88 0z" fill="url(#navy)"/><path d="M46 84a44 22 0 0 0 88 0z" fill="url(#amber)"/>
      <rect x="-118" y="56" width="30" height="28" rx="3" fill="#fff"/><rect x="62" y="56" width="30" height="28" rx="3" fill="#fff"/><path d="M-110 70h14M70 70h14" stroke="#0E8A83" stroke-width="4"/></g>
    <!-- bench pieces: small tools -->
    <g transform="translate(560 536)"><rect width="64" height="24" rx="4" fill="url(#amber)"/><rect x="8" y="-14" width="48" height="16" rx="3" fill="url(#teal)"/></g>
  </g>

  <!-- RIGHT : plateforme commune -->
  <g>
    <ellipse cx="1330" cy="742" rx="250" ry="24" fill="#5B4A2B" opacity=".35" filter="url(#soft)"/>
    <path d="M1130 690L1330 740L1530 690L1530 650L1330 700L1130 650Z" fill="#0F2342"/>
    <path d="M1130 650L1330 600L1530 650L1330 700Z" fill="url(#navy)"/>
    <!-- slots on platform -->
    <g stroke="#24BDB2" stroke-width="2" stroke-opacity=".8" fill="none">
      <path d="M1210 650L1260 637L1310 650L1260 663Z"/><path d="M1350 650L1400 637L1450 650L1400 663Z"/><path d="M1280 666L1330 653L1380 666L1330 679Z"/>
    </g>
    <!-- assembled blocks -->
    <g>
      <path d="M1240 616l50-14 50 14v-70l-50-14-50 14z" fill="#18A89F"/><path d="M1240 546l50 14 50-14-50-14z" fill="#5DD8CE"/><path d="M1290 560v56l50-14v-56z" fill="#0E8A83"/>
      <rect x="1262" y="565" width="22" height="3" fill="#fff" opacity=".8" transform="skewY(15) translate(0 -330)"/>
    </g>
    <g>
      <path d="M1360 640l46-13 46 13v-60l-46-13-46 13z" fill="#F0B04A"/><path d="M1360 580l46 13 46-13-46-13z" fill="#FAD28C"/><path d="M1406 593v47l46-13v-47z" fill="#D98E22"/>
    </g>
    <g>
      <path d="M1290 520l40-11 40 11v-46l-40-11-40 11z" fill="#2A4E8C" opacity=".95"/><path d="M1290 474l40 11 40-11-40-11z" fill="#6E93D1"/><path d="M1330 485v35l40-11v-35z" fill="#1B3A6B"/>
    </g>
    <!-- floating block being lowered with guide lines -->
    <g opacity=".95"><g stroke="#12284B" stroke-opacity=".35" stroke-dasharray="5 6" stroke-width="2"><path d="M1170 380V610M1250 360V600"/></g>
      <g transform="translate(1135 330)"><path d="M0 40l46-13 46 13v-50l-46-13-46 13z" fill="#F0B04A"/><path d="M0-10l46 13 46-13-46-13z" fill="#FAD28C"/><path d="M46 3v50l46-13v-50z" fill="#D98E22"/></g></g>
    <!-- arrow path from bench to platform -->
    <path d="M1100 520C1150 520 1160 560 1190 600" stroke="#0E8A83" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round" fill="none"/>
    <!-- sparkle of verified: stamp -->
    <g transform="translate(1470 420) rotate(-8)"><circle r="46" fill="#fff" stroke="#0E8A83" stroke-width="5"/><circle r="36" fill="none" stroke="#0E8A83" stroke-width="2" stroke-dasharray="4 4"/><path d="M-18 2l12 14 24-30" stroke="#0E8A83" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <!-- hanging lamp -->
  <g><path d="M800 0V120" stroke="#12284B" stroke-width="3"/><path d="M740 190a60 60 0 0 1 120 0z" fill="url(#navy)"/><ellipse cx="800" cy="190" rx="60" ry="8" fill="#FFE9A8"/><path d="M740 196L610 560H990L860 196Z" fill="#FFE9A8" opacity=".16"/></g>
  <!-- plants -->
  <g transform="translate(1520 560)"><path d="M0 100V60h50v40z" fill="#C0643A" transform="translate(-10 0)"/><g fill="#2F8F6B"><path d="M15 60C-10 30 -5 10 15 0C35 10 40 30 15 60z"/><path d="M15 60C40 40 60 40 66 20C45 15 25 30 15 60z" opacity=".85"/></g></g>
  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
